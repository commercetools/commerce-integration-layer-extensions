packages:
  # The example extension templates — each a self-contained template you work
  # inside (edit src/extension.ts, then `commercetools integration-layer extension
  # validate` / `... push`). The build → validate → push flow lives in the published
  # `@commercetools-internal/cli-topic-integration-layer` CLI plugin, installed into
  # the commercetools CLI (see the README), not in this workspace.
  - 'examples/*'

allowBuilds:
  esbuild: true
  '@apollo/protobufjs': false
  protobufjs: false

# Refuse dependency versions published less than 24h ago. Minutes; 1440 = 24h.
minimumReleaseAge: 1440
