name: Publish on merge

# Interim continuous publish: on every merge to main, stamp the plugin version
# with the commit sha and publish that prerelease to the internal GCP Artifact
# Registry — the same model as octolog's old ilc-publish (`<base>-<sha7>`,
# --tag latest so a bare `plugins install` resolves the newest build).
#
# This is a stopgap while the Changesets flow (release.yml) is disabled pending
# the CT Changesets App. When the App is provisioned, re-enable release.yml and
# delete this file. (publish-tag.yml stays for cutting a clean, non-prerelease
# release from a version tag.)
#
# Requires only the ops-terraform writer grant (this repo's GitHub Actions
# principalSet -> artifactregistry.writer on internal-npm), now merged. No
# Changesets App, no GitHub App secrets. Internal-repo only (the production pool's
# github WIF provider admits private/internal repos).

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  publish:
    name: sha-stamped publish to internal registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI plugin
        run: pnpm --filter @commercetools-internal/cli-topic-integration-layer build

      - name: Stamp the version with the commit sha
        # <base>-<sha7>, e.g. 0.1.0-a24322c — a unique, installable prerelease per
        # merge that never overwrites a released version. --no-git-tag-version: don't
        # touch git; --allow-same-version: a re-run for the same sha is a no-op.
        working-directory: packages/cli-topic-integration-layer
        run: |
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          base=$(node -p "require('./package.json').version")
          npm version "${base}-${sha}" --no-git-tag-version --allow-same-version

      - name: Authenticate to GCP (direct Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          # Direct WIF (no service account) — see ops-terraform npm_writers.
          workload_identity_provider: projects/884107378518/locations/global/workloadIdentityPools/production/providers/github

      - name: Authenticate npm to the internal Artifact Registry
        # Seed the workspace-root .npmrc with the OIDC-derived GCP token; pnpm reads
        # .npmrc (incl. the publish token) from the workspace root even when
        # publishing a package in packages/*.
        run: npx -y google-artifactregistry-auth --repo-config=.npmrc --credential-config=.npmrc --token="${{ steps.gcp-auth.outputs.access_token }}"

      - name: Publish
        # --tag latest: a `<base>-<sha7>` prerelease would NOT otherwise become the
        # `latest` dist-tag (npm skips auto-latest for prereleases), so a bare
        # `commercetools plugins install <name>` wouldn't resolve it — force it.
        # --no-git-checks: the sha stamp leaves the tree dirty. Tolerate a re-run
        # for an already-published sha.
        run: |
          if out=$(pnpm --filter @commercetools-internal/cli-topic-integration-layer publish --tag latest --no-git-checks 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -qiE 'already exists|cannot publish over|EPUBLISHCONFLICT|409' || exit 1
            echo ">> already published for this revision, nothing to do"
          fi
