name: Publish (tag)

# Interim, manual publish path for @commercetools-internal/cli-topic-integration-layer
# while the Changesets App (used by release.yml) isn't provisioned yet. Push a
# version tag and this publishes that version straight to the internal GCP
# Artifact Registry — no GitHub App, no release PR.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag version MUST match the plugin's package.json version (guarded below) —
# the package.json is the source of truth; the tag is just the release trigger.
#
# Still requires the ops-terraform writer grant (this repo's GitHub Actions
# principalSet -> artifactregistry.writer on internal-npm); until that merges the
# GCP auth step fails. It does NOT need the CT Changesets App secrets.
#
# When Changesets is live, prefer release.yml and retire this workflow. Only works
# while the repo is internal (the production pool's github WIF provider admits
# private/internal repos only).

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  publish:
    name: publish to internal registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./packages/cli-topic-integration-layer/package.json').version")"
          echo "tag=$tag_version package.json=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg_version — bump package.json or fix the tag"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI plugin
        run: pnpm --filter @commercetools-internal/cli-topic-integration-layer build

      - name: Authenticate to GCP (direct Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          # Direct WIF (no service account) — see release.yml / ops-terraform npm_writers.
          workload_identity_provider: projects/884107378518/locations/global/workloadIdentityPools/production/providers/github

      - name: Authenticate npm to the internal Artifact Registry
        # Seed the workspace-root .npmrc with the OIDC-derived GCP token; pnpm reads
        # .npmrc (incl. the publish token) from the workspace root even when
        # publishing a package in packages/*.
        run: npx -y google-artifactregistry-auth --repo-config=.npmrc --credential-config=.npmrc --token="${{ steps.gcp-auth.outputs.access_token }}"

      - name: Publish
        # Registry + restricted access come from the package's publishConfig.
        # --no-git-checks: the tag checkout is a detached HEAD, which pnpm would
        # otherwise refuse. Tolerate a re-run for an already-published version.
        run: |
          if out=$(pnpm --filter @commercetools-internal/cli-topic-integration-layer publish --no-git-checks 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -qiE 'already exists|cannot publish over|EPUBLISHCONFLICT|409' || exit 1
            echo ">> version already published, nothing to do"
          fi
