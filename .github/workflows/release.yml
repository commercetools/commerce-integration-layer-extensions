name: Release

# Versioning + changelog for @commercetools/cli-topic-integration-layer via Changesets.
# This workflow NEVER publishes — publishing stays in publish-release.yml (tag-triggered
# npm Trusted Publishing / OIDC), whose trust binding is tied to that one file. This split
# keeps package.json + tag as the single publish gate while letting Changesets own the
# version bump and the CHANGELOG.
#
# The flow:
#   1. Every merge to main runs `changesets/action`. If there are pending changesets it
#      opens/updates a "Version Packages" PR (bumps package.json, writes CHANGELOG).
#   2. When that Version PR is merged, this workflow runs again, finds NO pending
#      changesets, sees the bumped version has no tag yet, and pushes `v<version>` —
#      which triggers publish-release.yml to publish.
#
# ── Signatures: verified commits are required (repo ruleset) ──────────────────────────
# The Version Packages commit is created via the GitHub API (commitMode: github-api) so
# GitHub signs it — a local git-cli commit is unsigned and gets rejected (GH013). That
# API commit uses GITHUB_TOKEN (or a GitHub App token) — never a plain user PAT, whose
# API commits are unverified.
#
# ── Optional tokens (both are OFF by default; nothing here publishes) ──────────────────
# 1. RELEASE_TAG_PUSH_TOKEN — a tag pushed with the default GITHUB_TOKEN does NOT trigger
#    another workflow (GitHub's recursion guard), so the auto hand-off to publish-release.yml
#    needs a trigger-capable token: a fine-grained PAT (contents:write) or a GitHub App
#    token. Without it the tag is still pushed (via GITHUB_TOKEN) but publish-release.yml
#    won't auto-run — a maintainer re-pushes the tag once to publish.
# 2. CHANGESETS_APP_TOKEN — set to the CT Changesets App token if you also want the
#    Version Packages PR to trigger CI (a PR opened by GITHUB_TOKEN doesn't). App API
#    commits stay GitHub-verified, so the signature rule is still satisfied.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the "Version Packages" commit + the release tag
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    name: version + changelog (Changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags to know if v<version> already exists
          # Prefer the trigger-capable token so the tag push fires publish-release.yml
          # (and the Version PR triggers CI); fall back to GITHUB_TOKEN when unset.
          token: ${{ secrets.RELEASE_TAG_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the "Version Packages" PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # No `publish` — publishing is publish-release.yml's job (OIDC on a version tag).
          commit: 'ci(changesets): version packages'
          title: 'ci(changesets): version packages'
          # Create the Version Packages commit via the GitHub API, not local git. The
          # repo ruleset requires verified signatures; API-created commits are signed by
          # GitHub (a local git-cli commit is unsigned and gets rejected — GH013).
          commitMode: github-api
        env:
          # Must be a token whose API commits are GitHub-verified: GITHUB_TOKEN (default)
          # or a GitHub App token (e.g. the CT Changesets App). NOT a plain user PAT — its
          # API commits are unverified and the ruleset would reject them. This is separate
          # from RELEASE_TAG_PUSH_TOKEN, which only exists to make the tag trigger publish.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_APP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag the release when the Version PR has landed
        # hasChangesets == false means nothing is pending: either the Version PR just
        # merged (a new version needing a tag) or there is simply nothing to release.
        # Push v<version> only when that tag doesn't already exist — this is the trigger
        # for publish-release.yml.
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="$(node -p "require('./packages/cli-topic-integration-layer/package.json').version")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists — nothing to release"
            exit 0
          fi
          echo "tagging ${tag} to trigger publish-release.yml"
          git tag "${tag}"
          git push origin "${tag}"
