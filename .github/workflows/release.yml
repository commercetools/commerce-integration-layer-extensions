name: Release

# Versioning + changelog for @commercetools/cli-topic-integration-layer via Changesets.
# This workflow NEVER publishes — publishing stays in publish-release.yml (tag-triggered
# npm Trusted Publishing / OIDC), whose trust binding is tied to that one file. This split
# keeps package.json + tag as the single publish gate while letting Changesets own the
# version bump and the CHANGELOG.
#
# The flow:
#   1. Every merge to main runs `changesets/action`. If there are pending changesets it
#      opens/updates a "Version Packages" PR (bumps package.json, writes CHANGELOG).
#   2. When that Version PR is merged, this workflow runs again, finds NO pending
#      changesets, sees the bumped version has no tag yet, and pushes `v<version>` —
#      which triggers publish-release.yml to publish.
#
# ── The one out-of-repo requirement ──────────────────────────────────────────────────
# A tag pushed with the default GITHUB_TOKEN does NOT trigger another workflow (GitHub's
# recursion guard), so the auto hand-off to publish-release.yml needs a token that CAN:
# set the repo/org secret RELEASE_TAG_PUSH_TOKEN to a fine-grained PAT (contents:write)
# or the CT Changesets App token. Using it for the Changesets step too means the Version
# PR triggers CI as a bonus. It is OPTIONAL: without it this workflow still opens the
# Version PR and pushes the tag (via GITHUB_TOKEN) — publish-release.yml just won't
# auto-run, so a maintainer re-pushes the tag (or runs it) once. Nothing publishes here.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the "Version Packages" commit + the release tag
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    name: version + changelog (Changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags to know if v<version> already exists
          # Prefer the trigger-capable token so the tag push fires publish-release.yml
          # (and the Version PR triggers CI); fall back to GITHUB_TOKEN when unset.
          token: ${{ secrets.RELEASE_TAG_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the "Version Packages" PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # No `publish` — publishing is publish-release.yml's job (OIDC on a version tag).
          commit: 'ci(changesets): version packages'
          title: 'ci(changesets): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TAG_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag the release when the Version PR has landed
        # hasChangesets == false means nothing is pending: either the Version PR just
        # merged (a new version needing a tag) or there is simply nothing to release.
        # Push v<version> only when that tag doesn't already exist — this is the trigger
        # for publish-release.yml.
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="$(node -p "require('./packages/cli-topic-integration-layer/package.json').version")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists — nothing to release"
            exit 0
          fi
          echo "tagging ${tag} to trigger publish-release.yml"
          git tag "${tag}"
          git push origin "${tag}"
