name: Release

# Versions and publishes @commercetools-internal/cli-topic-integration-layer via
# Changesets, following the commercetools Changesets convention (release PR
# managed by the CT Changesets App), adapted to publish to the internal GCP
# Artifact Registry via GitHub -> GCP Workload Identity Federation.
#
# ⚠️ TEMPORARILY DISABLED — trigger is `workflow_dispatch` only (manual), so it
# never auto-runs. The CT Changesets App (prerequisite 2) isn't provisioned yet,
# so on push-to-main this workflow only produced red runs. In the meantime the
# interim path is publish-on-merge.yml, which sha-stamps and publishes every merge
# to main (like octolog's old ilc-publish). To RE-ENABLE Changesets once the App
# is installed: restore `on: push: branches: [main]` below and delete
# publish-on-merge.yml.
#
# PREREQUISITES to make it pass (each is a one-time setup, not code):
#   1. This repo's GitHub Actions OIDC principalSet granted Artifact Registry
#      writer on commercetools-platform/internal-npm — a DIRECT principalSet grant
#      (no service account), via the production pool's github provider. Provisioned
#      by ops-terraform (npm_writers in special-delivery/registry/gcp), which is why
#      the provider below is hardcoded (a stable, non-secret identifier). CircleCI's
#      WIF was an org-wide, read-only principalSet; this adds a writer for this repo.
#   2. The CT Changesets GitHub App installed on the repo, exposing the
#      CT_CHANGESETS_APP_ID + CT_CHANGESETS_APP_PEM secrets (lets the "Version
#      Packages" PR trigger CI, which the default GITHUB_TOKEN cannot).
#
# To flip to PUBLIC npm later ("public soon"): rename the package scope to
# @commercetools/cli-topic-integration-layer, drop this GCP-auth block, and add
# an npm registry _authToken from an NPM_TOKEN secret (the plain ct nodejs model).

# Disabled: manual-only until the CT Changesets App is provisioned (see header).
# Re-enable by restoring:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for GCP Workload Identity Federation

jobs:
  release:
    name: version + publish (Changesets)
    runs-on: ubuntu-latest
    steps:
      - name: Generate a GitHub token (CT Changesets App)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI plugin
        run: pnpm --filter @commercetools-internal/cli-topic-integration-layer build

      - name: Authenticate to GCP (direct Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          # Direct WIF (no service account): this repo's principalSet is granted
          # Artifact Registry writer directly (ops-terraform npm_writers). The
          # provider is the org's production pool github provider — a stable,
          # non-secret identifier (884107378518 = commercetools-platform project).
          # This writes an external_account ADC file; token_format: access_token is
          # NOT available without a service account, so mint the token via gcloud.
          workload_identity_provider: projects/884107378518/locations/global/workloadIdentityPools/production/providers/github

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate npm to the internal Artifact Registry
        # Mint a federated access token from the direct-WIF ADC and write it as the
        # registry _authToken so `changeset publish` can push to the
        # @commercetools-internal registry. (pnpm reads .npmrc from the workspace root.)
        run: |
          token="$(gcloud auth application-default print-access-token)"
          npx -y google-artifactregistry-auth --repo-config=.npmrc --credential-config=.npmrc --token="$token"

      - name: Create the Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'ci(changesets): version packages'
          title: 'ci(changesets): version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
